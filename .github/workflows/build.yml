name: Build PosterChef

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-11, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # -----------------------
      # macOS deps
      # -----------------------
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install qt pkg-config libimobiledevice libimobiledevice-glue openssl minizip
          echo "$(brew --prefix qt)/bin" >> $GITHUB_PATH
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV

      # -----------------------
      # Windows deps
      # -----------------------
      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.1
          arch: win64_msvc2019_64

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true

      # -----------------------
      # Build
      # -----------------------
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release --prefix install

      # -----------------------
      # Bundle runtime
      # -----------------------

      - name: windeployqt
        if: runner.os == 'Windows'
        run: |
          windeployqt install\bin\PosterChef.exe

      # -----------------------
      # Artifacts
      # -----------------------
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PosterChef-macOS
          path: install/PosterChef.app

      - name: Upload Windows app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PosterChef-Windows
          path: install/bin
